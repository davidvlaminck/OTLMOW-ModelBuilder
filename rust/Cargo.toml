[package]
name = "otlmow_modelbuilder_rs"
version = "0.1.0"
edition = "2021"

[lib]
name = "_otlmow_modelbuilder_rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
rusqlite = { version = "0.32", features = ["bundled"] }
oxttl = "0.2"
oxrdf = "0.3"
